services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socialposter
      POSTGRES_PASSWORD: socialposter
      POSTGRES_DB: socialposter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialposter"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3600:3600"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 3600 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3500:3500"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3500"

volumes:
  postgres_data:
